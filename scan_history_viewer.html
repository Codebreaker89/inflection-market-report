const PAGE_SIZE = 75;
let filtered = [], sortCol = 'scan_date', sortDir = -1, page = 0;

function num(v) { return v !== null && v !== '' && !isNaN(parseFloat(v)) ? parseFloat(v) : null; }

// Populate filter dropdowns
const dates = [...new Set(DATA.map(r=>r.scan_date))].sort().reverse();
const strats = [...new Set(DATA.map(r=>r.strategy))].sort();
const dSel = document.getElementById('f-date');
dates.forEach(d => { const o=document.createElement('option'); o.value=d; o.text=d; dSel.appendChild(o); });
const sSel = document.getElementById('f-strat');
strats.forEach(s => { const o=document.createElement('option'); o.value=s; o.text=s; sSel.appendChild(o); });

function applyFilters() {
  const q     = document.getElementById('q').value.toLowerCase();
  const fDate = document.getElementById('f-date').value;
  const fStrat= document.getElementById('f-strat').value;
  const fOut  = document.getElementById('f-outcome').value;
  const fScr  = document.getElementById('f-score').value;
  const fMul  = document.getElementById('f-multi').value;

  filtered = DATA.filter(r => {
    if (q && !r.ticker.toLowerCase().includes(q) && !(r.company||'').toLowerCase().includes(q)) return false;
    if (fDate && r.scan_date !== fDate) return false;
    if (fStrat && r.strategy !== fStrat) return false;
    const d5 = num(r.ret_d5);
    if (fOut === 'win'     && !(d5 !== null && d5 > 0))  return false;
    if (fOut === 'loss'    && !(d5 !== null && d5 < 0))  return false;
    if (fOut === 'pending' && d5 !== null)                return false;
    const sc = num(r.score);
    if (fScr === '0-3' && !(sc !== null && sc <= 3))     return false;
    if (fScr === '4-5' && !(sc !== null && sc >= 4 && sc <= 5)) return false;
    if (fScr === '6-8' && !(sc !== null && sc >= 6 && sc <= 8)) return false;
    if (fScr === '9+'  && !(sc !== null && sc >= 9))     return false;
    const mc = num(r.strategies_count);
    if (fMul === '2' && !(mc !== null && mc >= 2))       return false;
    if (fMul === '1' && !(mc !== null && mc < 2))        return false;
    return true;
  });

  // Sort
  filtered.sort((a,b) => {
    let av = a[sortCol], bv = b[sortCol];
    const an = parseFloat(av), bn = parseFloat(bv);
    if (!isNaN(an) && !isNaN(bn)) return sortDir*(an-bn);
    return sortDir*((av||'').toString().localeCompare((bv||'').toString()));
  });

  page = 0;
  renderStats();
  renderPage();
  renderPager();
}

function renderStats() {
  const f = filtered.filter(r => num(r.ret_d5) !== null);
  const wins = f.filter(r => num(r.ret_d5) > 0).length;
  const wr = f.length ? (100*wins/f.length).toFixed(0) : '─';
  const avg = f.length ? (f.reduce((s,r)=>s+num(r.ret_d5),0)/f.length).toFixed(2) : '─';
  document.getElementById('count-badge').textContent = `${filtered.length} rows`;
  document.getElementById('stats').textContent =
    f.length ? `d5 filled: ${f.length} · WR: ${wr}% · avg: ${avg}%` : `${filtered.length} rows · no d5 data yet`;
}

function fmt(v, pct=true) {
  const n = num(v);
  if (n === null) return '<span style="color:#444">─</span>';
  const s = pct ? n.toFixed(2)+'%' : n.toFixed(2);
  return n > 0 ? `<span class="win">+${s}</span>` : n < 0 ? `<span class="loss">${s}</span>` : s;
}

function renderPage() {
  const start = page * PAGE_SIZE, end = start + PAGE_SIZE;
  const slice = filtered.slice(start, end);
  const sc = r => `<span class="strat strat-${r.strategy.replace(/_/g,'-')}">${r.strategy}</span>`;
  const sl = r => r.hit_stop_loss_d5 == 1 ? '<span class="loss">⚠ SL</span>' : (r.hit_stop_loss_d5 == 0 && num(r.ret_d5) !== null ? '✓' : '');
  document.getElementById('tbody').innerHTML = slice.map(r => `<tr>
    <td>${r.scan_date}</td>
    <td><b>${r.ticker}</b><span style="color:#666;font-size:10px;margin-left:4px">${(r.company||'').substring(0,18)}</span></td>
    <td>${sc(r)}</td>
    <td style="text-align:center">${r.strategies_count||''}</td>
    <td style="text-align:center">${r.score||''}</td>
    <td style="text-align:right">${r.price_at_scan ? parseFloat(r.price_at_scan).toFixed(2) : '─'}</td>
    <td style="text-align:right">${r.rsi ? parseFloat(r.rsi).toFixed(1) : '─'}</td>
    <td style="text-align:right">${r.adx ? parseFloat(r.adx).toFixed(1) : '─'}</td>
    <td style="text-align:right">${fmt(r.ret_d5)}</td>
    <td style="text-align:right">${fmt(r.ret_d10)}</td>
    <td style="text-align:right">${fmt(r.spy_ret_d5)}</td>
    <td style="text-align:right">${fmt(r.excess_ret_d5)}</td>
    <td style="text-align:center">${sl(r)}</td>
  </tr>`).join('');
}

function renderPager() {
  const total = Math.ceil(filtered.length / PAGE_SIZE);
  const bar = document.getElementById('pg-bar');
  bar.innerHTML = '';
  for (let i=0; i<total; i++) {
    const b = document.createElement('button');
    b.textContent = i+1;
    if (i===page) b.classList.add('active');
    b.onclick = () => { page=i; renderPage(); renderPager(); };
    bar.appendChild(b);
  }
  document.getElementById('pg-info').textContent =
    `Page ${page+1} of ${total||1} · rows ${page*PAGE_SIZE+1}–${Math.min((page+1)*PAGE_SIZE,filtered.length)} of ${filtered.length}`;
}

function sortBy(col) {
  if (sortCol===col) sortDir*=-1; else { sortCol=col; sortDir=-1; }
  document.querySelectorAll('thead th').forEach(th => th.classList.remove('sorted-asc','sorted-desc'));
  const ths = document.querySelectorAll('thead th');
  const cols = ['scan_date','ticker','strategy','strategies_count','score','price_at_scan','rsi','adx','ret_d5','ret_d10','spy_ret_d5','excess_ret_d5','hit_stop_loss_d5'];
  const idx = cols.indexOf(col);
  if (idx>=0) ths[idx].classList.add(sortDir===1?'sorted-asc':'sorted-desc');
  applyFilters();
}

applyFilters();
</script>
