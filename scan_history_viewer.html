<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scan History</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f0f13; color: #e0e0e0; font-size: 13px; }
  h1 { padding: 16px 20px 8px; color: #fff; font-size: 18px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 20px 12px; align-items: center; }
  .controls input, .controls select { background: #1e1e2e; border: 1px solid #333; color: #e0e0e0; padding: 5px 10px; border-radius: 6px; font-size: 12px; }
  .controls input { width: 160px; }
  .controls select { min-width: 120px; }
  .badge { background: #2a2a3e; border: 1px solid #444; border-radius: 12px; padding: 3px 10px; font-size: 11px; color: #aaa; white-space: nowrap; }
  #stats { padding: 0 20px 8px; color: #888; font-size: 12px; }
  .tbl-wrap { overflow-x: auto; padding: 0 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th { background: #1a1a2e; color: #aaa; font-weight: 600; padding: 8px 6px; text-align: left; cursor: pointer; white-space: nowrap; position: sticky; top: 0; border-bottom: 1px solid #333; user-select: none; }
  thead th:hover { color: #fff; }
  thead th.sorted-asc::after { content: " ▲"; font-size: 9px; }
  thead th.sorted-desc::after { content: " ▼"; font-size: 9px; }
  tbody tr:nth-child(odd)  { background: #131320; }
  tbody tr:nth-child(even) { background: #0f0f1a; }
  tbody tr:hover { background: #1e1e35; }
  td { padding: 6px 6px; white-space: nowrap; }
  .win  { color: #4ade80; }
  .loss { color: #f87171; }
  .pend { color: #facc15; }
  .strat { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
  .strat-breakout      { background: #1d3a5f; color: #60a5fa; }
  .strat-momentum      { background: #3a1d5f; color: #c084fc; }
  .strat-high_tight_flag { background: #5f3a1d; color: #fb923c; }
  .strat-pocket_pivot  { background: #1d5f3a; color: #4ade80; }
  .strat-ema_ribbon    { background: #5f5f1d; color: #facc15; }
  .strat-cup_handle    { background: #5f1d3a; color: #f472b6; }
  .strat-connors_rsi   { background: #1d5f5f; color: #22d3ee; }
  .multi { color: #a78bfa; font-weight: 700; }
  .pagination { display: flex; gap: 6px; align-items: center; padding: 12px 20px; }
  .pagination button { background: #1e1e2e; border: 1px solid #333; color: #e0e0e0; padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .pagination button:hover { background: #2a2a3e; }
  .pagination button.active { background: #3b5bdb; border-color: #3b5bdb; color: #fff; }
  .pagination span { color: #888; font-size: 12px; }
  label { color: #aaa; font-size: 12px; }
</style>
</head>
<body>
<h1>📊 Scan History</h1>
<div class="controls">
  <input id="q" type="text" placeholder="Search ticker / company…" oninput="applyFilters()">
  <select id="fDate" onchange="applyFilters()">
    <option value="">All Dates</option>
  </select>
  <select id="fStrat" onchange="applyFilters()">
    <option value="">All Strategies</option>
  </select>
  <select id="fOutcome" onchange="applyFilters()">
    <option value="">All Outcomes</option>
    <option value="win">Winners (ret_d5 > 0)</option>
    <option value="loss">Losers (ret_d5 < 0)</option>
    <option value="stop">Stop Hit</option>
    <option value="multi">Multi-Strategy (≥2)</option>
    <option value="pending">Pending (no ret_d5)</option>
  </select>
  <select id="fSector" onchange="applyFilters()">
    <option value="">Any Score</option>
    <option value="high">Score ≥ 9</option>
    <option value="mid">Score 6-8</option>
    <option value="low">Score ≤ 5</option>
  </select>
  <span class="badge" id="cntBadge">788 signals</span>
</div>
<div id="stats"></div>
<div class="tbl-wrap">
<table id="tbl">
  <thead>
    <tr>
      <th onclick="sortBy('scan_date')">Date</th>
      <th onclick="sortBy('ticker')">Ticker</th>
      <th onclick="sortBy('strategy')">Strategy</th>
      <th onclick="sortBy('strategies_count')">Multi</th>
      <th onclick="sortBy('score')">Score</th>
      <th onclick="sortBy('adx')">ADX</th>
      <th onclick="sortBy('rsi')">RSI</th>
      <th onclick="sortBy('vol_ratio')">Vol×</th>
      <th onclick="sortBy('price_at_scan')">Price</th>
      <th onclick="sortBy('ret_d5')">Ret D5%</th>
      <th onclick="sortBy('excess_ret_d5')">Excess D5%</th>
      <th onclick="sortBy('hit_stop_loss_d5')">SL Hit</th>
      <th onclick="sortBy('ret_d10')">Ret D10%</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
</div>
<div class="pagination" id="pager"></div>

let filtered = [...RAW];
let sortCol = 'scan_date', sortDir = -1;
let page = 1;
const PER_PAGE = 75;

// Populate filter dropdowns
const dates = [...new Set(RAW.map(r=>r.scan_date))].sort();
const strats = [...new Set(RAW.map(r=>r.strategy))].sort();
const fDate = document.getElementById('fDate');
const fStrat = document.getElementById('fStrat');
dates.forEach(d => { const o=document.createElement('option'); o.value=d; o.text=d; fDate.appendChild(o); });
strats.forEach(s => { const o=document.createElement('option'); o.value=s; o.text=s; fStrat.appendChild(o); });

function applyFilters() {
  const q = document.getElementById('q').value.toLowerCase();
  const fd = fDate.value;
  const fs = fStrat.value;
  const fo = document.getElementById('fOutcome').value;
  const fsc = document.getElementById('fSector').value;

  filtered = RAW.filter(r => {
    if (q && !r.ticker.toLowerCase().includes(q) && !r.company.toLowerCase().includes(q)) return false;
    if (fd && r.scan_date !== fd) return false;
    if (fs && r.strategy !== fs) return false;
    if (fo === 'win' && !(parseFloat(r.ret_d5) > 0)) return false;
    if (fo === 'loss' && !(parseFloat(r.ret_d5) < 0)) return false;
    if (fo === 'stop' && r.hit_stop_loss_d5 !== '1') return false;
    if (fo === 'multi' && parseInt(r.strategies_count) < 2) return false;
    if (fo === 'pending' && r.ret_d5 !== '') return false;
    if (fsc === 'high' && !(parseInt(r.score) >= 9)) return false;
    if (fsc === 'mid' && !(parseInt(r.score) >= 6 && parseInt(r.score) <= 8)) return false;
    if (fsc === 'low' && !(parseInt(r.score) <= 5)) return false;
    return true;
  });

  // re-sort
  doSort(false);
  page = 1;
  renderStats();
  render();
}

function doSort(toggle=true) {
  if (toggle) {
    if (sortCol === arguments[0]) sortDir *= -1;
    else { sortCol = arguments[0]; sortDir = -1; }
  }
  filtered.sort((a,b) => {
    let av = a[sortCol], bv = b[sortCol];
    const an = parseFloat(av), bn = parseFloat(bv);
    if (!isNaN(an) && !isNaN(bn)) return (an - bn) * sortDir;
    return String(av).localeCompare(String(bv)) * sortDir;
  });
}

function sortBy(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = -1; }
  doSort(false);
  page = 1;
  render();
  // update header classes
  document.querySelectorAll('thead th').forEach(th => {
    th.classList.remove('sorted-asc','sorted-desc');
  });
}

function fmt(v, decimals=2) {
  if (v === '' || v === null || v === undefined) return '<span style="color:#555">—</span>';
  const n = parseFloat(v);
  if (isNaN(n)) return v;
  return n.toFixed(decimals);
}

function retCell(v) {
  if (v === '') return '<span style="color:#555">—</span>';
  const n = parseFloat(v);
  if (isNaN(n)) return v;
  const cls = n > 0 ? 'win' : n < 0 ? 'loss' : '';
  const sign = n > 0 ? '+' : '';
  return `<span class="${cls}">${sign}${n.toFixed(2)}%</span>`;
}

function renderStats() {
  const filled = filtered.filter(r => r.ret_d5 !== '');
  const wins = filled.filter(r => parseFloat(r.ret_d5) > 0);
  const wr = filled.length ? (wins.length/filled.length*100).toFixed(1) : '—';
  const avgRet = filled.length ? (filled.reduce((s,r)=>s+parseFloat(r.ret_d5),0)/filled.length).toFixed(2) : '—';
  document.getElementById('stats').innerHTML =
    `Showing <b>${filtered.length}</b> signals &nbsp;|&nbsp; ` +
    `Filled D5: <b>${filled.length}</b> &nbsp;|&nbsp; ` +
    `Win Rate: <b class="win">${wr}%</b> &nbsp;|&nbsp; ` +
    `Avg Ret D5: <b class="${parseFloat(avgRet)>=0?'win':'loss'}">${avgRet}%</b>`;
  document.getElementById('cntBadge').textContent = filtered.length + ' signals';
}

function render() {
  const start = (page-1)*PER_PAGE;
  const slice = filtered.slice(start, start+PER_PAGE);
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = slice.map(r => {
    const mc = parseInt(r.strategies_count) >= 2 ? 'multi' : '';
    const sc = `strat strat-${r.strategy.replace(/[^a-z0-9]/gi,'_')}`;
    return `<tr>
      <td>${r.scan_date}</td>
      <td><b>${r.ticker}</b>${r.company ? '<br><span style="color:#666;font-size:10px">'+r.company.slice(0,22)+'</span>' : ''}</td>
      <td><span class="${sc}">${r.strategy}</span></td>
      <td class="${mc}">${r.strategies_count || '1'}</td>
      <td>${r.score || '—'}</td>
      <td>${fmt(r.adx,1)}</td>
      <td>${fmt(r.rsi,1)}</td>
      <td>${fmt(r.vol_ratio,2)}</td>
      <td>${fmt(r.price_at_scan,2)}</td>
      <td>${retCell(r.ret_d5)}</td>
      <td>${retCell(r.excess_ret_d5)}</td>
      <td>${r.hit_stop_loss_d5==='1'?'<span class="loss">⛔</span>':'<span style="color:#555">—</span>'}</td>
      <td>${retCell(r.ret_d10)}</td>
    </tr>`;
  }).join('');

  // pagination
  const total = Math.ceil(filtered.length / PER_PAGE);
  const pager = document.getElementById('pager');
  let btns = `<span>${start+1}–${Math.min(start+PER_PAGE, filtered.length)} of ${filtered.length}</span>`;
  if (page > 1) btns += `<button onclick="goPage(${page-1})">‹ Prev</button>`;
  const lo = Math.max(1, page-2), hi = Math.min(total, page+2);
  for (let i=lo; i<=hi; i++) btns += `<button class="${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
  if (page < total) btns += `<button onclick="goPage(${page+1})">Next ›</button>`;
  pager.innerHTML = btns;
}

function goPage(p) { page=p; render(); window.scrollTo(0,0); }

// init
applyFilters();
</script>
